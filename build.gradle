buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.chasemeng.schematicannonexcavator'
base { archivesName = 'SchematicannonExcavator' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

jarJar.enable()

repositories {
    flatDir { dirs 'libs' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.tterrag.com/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.6'
    implementation fg.deobf("local:create:0.5.1.j")
    implementation fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    jarJar(group: 'com.tterrag.registrate', name: 'Registrate', version: "[MC1.20,MC1.21)") {
        jarJar.pin(it, 'MC1.20-1.3.3')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'schematicannonexcavator.refmap.json'
    config 'schematicannonexcavator.mixins.json'
}

reobf { jarJar {} }
tasks.jarJar.finalizedBy('reobfJarJar')
tasks.jarJar.configure { archiveClassifier = '' }
jar { archiveClassifier = 'slim' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1', minecraft_version_range: '[1.20.1,1.21)',
            forge_version: '47.4.6', forge_version_range: '[47.4.6,)',
            loader_version_range: '[47,)',
            mod_id: 'schematicannonexcavator', mod_name: 'Schematicannon Excavator',
            mod_license: 'All Rights Reserved', mod_version: project.version,
            mod_authors: 'Chase_meng',
            mod_description: 'Adds excavator functionality to the Create Schematicannon.'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': 'schematicannonexcavator',
                'Specification-Vendor': 'Chase_meng',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'Chase_meng'
        ])
    }
    finalizedBy 'reobfJar'
}